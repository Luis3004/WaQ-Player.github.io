<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - Alberto Edition</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-orange: #ff9800;
            --text-gray: #8b949e;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal según 1000334841.jpg */
        .player-screen {
            width: 100%;
            max-width: 400px;
            padding-top: 60px;
            text-align: center;
            flex: 1;
        }

        .album-art {
            width: 280px;
            height: 280px;
            background-color: #1c2128;
            border-radius: 40px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: bold;
            color: var(--accent-orange);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .song-info h2 { font-size: 24px; margin: 0; }
        .song-info p { color: var(--accent-orange); margin: 8px 0; font-size: 16px; }
        .song-info span { color: var(--text-gray); font-size: 12px; font-style: italic; }

        /* Controles */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background-color: var(--accent-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.4);
        }

        /* Botón de cambio de modo (Lo amarillo en la imagen) */
        .mode-selector {
            width: 60px;
            height: 6px;
            background-color: #ffff00;
            margin: 25px auto;
            border-radius: 3px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mode-selector:active { transform: scaleX(1.2); }

        /* Biblioteca Deslizable */
        .library-tray {
            position: fixed;
            bottom: -75vh;
            left: 0;
            width: 100%;
            height: 85vh;
            background-color: #161b22;
            border-radius: 40px 40px 0 0;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .library-tray.open { transform: translateY(-75vh); }

        .tray-handle {
            width: 40px;
            height: 4px;
            background: #30363d;
            margin: 15px auto;
            border-radius: 2px;
        }

        .library-label {
            text-align: center;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--text-gray);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .song-list {
            overflow-y: auto;
            padding: 0 20px;
        }

        .list-item {
            padding: 15px;
            border-bottom: 1px solid #21262d;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-screen">
        <div class="album-art">TU</div>
        
        <div class="song-info">
            <h2>Tuesday</h2>
            <p>Burak Yeter, Danelle Sandoval</p>
            <span>Sencillo: Tuesday (2016)</span>
        </div>

        <div class="controls">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            <div class="play-btn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M16 6h2v12h-2zm-10.5 6l8.5 6V6z" transform="rotate(180 12 12)"/></svg>
        </div>

        <!-- Botón Amarillo: Cambio de Modo -->
        <div class="mode-selector" id="modeBtn" onclick="alert('Modo 8D Activado')"></div>
    </div>

    <!-- Biblioteca -->
    <div class="library-tray" id="tray">
        <div class="tray-handle"></div>
        <div class="library-label">BIBLIOTECA</div>
        <div class="song-list" id="songList">
            <!-- Ejemplo de items -->
            <div class="list-item">Tuesday - Burak Yeter</div>
            <div class="list-item">Lady Gaga - Peso Pluma</div>
            <div class="list-item">Vita Fer - Los Dareyes</div>
        </div>
    </div>

    <script>
        const tray = document.getElementById('tray');
        let startY = 0;

        // Lógica de deslizamiento para abrir (Swipe Up)
        document.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;

            // Si desliza hacia arriba más de 50px
            if (diffY > 50 && !tray.classList.contains('open')) {
                tray.classList.add('open');
            }
            // Si desliza hacia abajo más de 50px para cerrar
            if (diffY < -50 && tray.classList.contains('open')) {
                tray.classList.remove('open');
            }
        });

        // También se puede abrir haciendo click en la etiqueta "BIBLIOTECA"
        document.querySelector('.library-label').onclick = () => {
            tray.classList.toggle('open');
        };
    </script>
</body>
</html>
